name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate software version files
        run: pnpm version:check

      - name: Test software version mismatch fixture
        run: node scripts/release/version-check-fixture.mjs

      - name: Validate Blueprint and README implementation contract
        shell: bash
        run: |
          set -euo pipefail

          test -s BLUEPRINT.md
          test -s README.md

          blueprint_version="$(sed -n 's/^\*\*Version:\*\* `\([^`]*\)`.*/\1/p' BLUEPRINT.md | head -n1)"
          readme_blueprint_version="$(sed -n 's/^\*\*Blueprint document baseline:\*\* `DHGS v\([^`]*\)`.*/\1/p' README.md | head -n1)"

          if [ -z "$blueprint_version" ] || [ -z "$readme_blueprint_version" ]; then
            echo 'Unable to read Blueprint document versions from BLUEPRINT.md / README.md.' >&2
            exit 1
          fi

          if [ "$blueprint_version" != "$readme_blueprint_version" ]; then
            echo "Blueprint version drift: BLUEPRINT=$blueprint_version README=$readme_blueprint_version" >&2
            exit 1
          fi

          grep -F 'M0 — FOUNDATION KERNEL' BLUEPRINT.md >/dev/null
          grep -F 'M5 — DEPLOYMENT, GOVERNANCE-OF-SOFTWARE & CONTROLLED PILOT' BLUEPRINT.md >/dev/null
          grep -F '# 203. Repository delivery and version-stream contract' BLUEPRINT.md >/dev/null
          grep -F 'GitHub issue #6' BLUEPRINT.md >/dev/null

          grep -F 'M0 — FOUNDATION KERNEL — ACTIVE' README.md >/dev/null
          grep -F 'M5 — DEPLOYMENT, GOVERNANCE-OF-SOFTWARE & CONTROLLED PILOT' README.md >/dev/null
          grep -F 'github.com/bjo163/dhgs/issues/6' README.md >/dev/null
          grep -F 'server-side GitHub Rulesets are not yet considered active/verified' README.md >/dev/null

          if grep -F 'M4 — ASSURANCE & PILOT' BLUEPRINT.md >/dev/null; then
            echo 'Stale implementation milestone found: M4 — ASSURANCE & PILOT' >&2
            exit 1
          fi

          echo "Blueprint/README contract aligned at document version $blueprint_version"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AWS_SECRET_ACCESS_KEY=)' -- ':!*.md' ':!.github/**'; then
            echo 'Potential secret material found in tracked source.' >&2
            exit 1
          fi
