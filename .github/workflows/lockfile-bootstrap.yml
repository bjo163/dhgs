name: Lockfile Bootstrap

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'
      - '.node-version'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'engines/*/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - name: Verify toolchain
        run: pnpm toolchain:check
      - name: Generate canonical lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify generated lockfile exists
        run: test -s pnpm-lock.yaml
      - name: Commit canonical lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo 'Canonical lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build(deps): establish canonical pnpm lockfile [skip ci]'
          git push origin HEAD:dev
