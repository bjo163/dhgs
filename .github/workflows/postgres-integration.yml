name: PostgreSQL Integration

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dhgs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dhgs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Verify toolchain
        run: pnpm toolchain:check
      - name: Install canonical dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run PostgreSQL adapter integration tests
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/dhgs
          PG_APP_URL: postgres://dhgs_app:dhgs_app@127.0.0.1:5432/dhgs
        run: pnpm --filter @dhgs/orm-postgres test:integration
      - name: Run asynchronous durability integration tests
        env:
          PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/dhgs
        run: pnpm --filter @dhgs/async-postgres test:integration
