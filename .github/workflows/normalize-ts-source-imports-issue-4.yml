name: Issue 4 TS Source Import Normalization

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/normalize-ts-source-imports-issue-4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Normalize relative emitted-JS specifiers in TS source packages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['packages/orm/src', 'packages/orm-base/src'];
          let changed = 0;

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== '__tests__') walk(full);
                continue;
              }
              if (!/\.(ts|tsx)$/.test(entry.name)) continue;
              const before = fs.readFileSync(full, 'utf8');
              const after = before.replace(/(['"])(\.\.?\/[^'"\n]+)\.js\1/g, '$1$2$1');
              if (after !== before) {
                fs.writeFileSync(full, after);
                changed += 1;
                console.log(`normalized ${full}`);
              }
            }
          }

          for (const root of roots) walk(root);
          console.log(`normalized files: ${changed}`);
          NODE
      - name: Commit normalized source imports
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/orm/src packages/orm-base/src; then
            echo 'Source imports already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/orm/src packages/orm-base/src
          git commit -m 'fix(source): normalize TS-relative imports for Turbopack [skip ci]'
          git push origin HEAD:dev
