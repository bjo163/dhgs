name: Issue Governance

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  validate-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate implementation issue naming
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || '';
            const valid = /^\[(M[0-5]|MASTER|BUG|SECURITY|DOCS)\]\s+.+/i.test(title);
            if (valid) return;
            const marker = '<!-- dhgs-issue-governance -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (comments.some(c => (c.body || '').includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `${marker}\nDHGS implementation issues should use a controlled prefix: \`[M0]\` … \`[M5]\`, \`[MASTER]\`, \`[BUG]\`, \`[SECURITY]\`, or \`[DOCS]\`. Please also include objective, scope/non-scope, dependencies, acceptance criteria, required tests, and definition of done.`,
            });
