name: Issue 4 Lockfile Refresh

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/lockfile-refresh-issue-4.yml'
      - 'packages/ui/package.json'
      - 'apps/ops-web/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
      - name: Verify toolchain
        run: pnpm toolchain:check
      - name: Intentionally refresh canonical lockfile for issue #4
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile update
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already represents issue #4 package metadata.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build(deps): register generic-admin workspace dependencies [skip ci]'
          git push origin HEAD:dev
