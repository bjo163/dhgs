<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Example public metric chart</title><desc id="desc">A sample line chart showing a declining repeat-failure rate with labeled axes and source note.</desc><rect width="800" height="480" fill="#fff"/><text x="64" y="50" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="700" fill="#132033">Repeat failure rate — example template</text><text x="64" y="78" font-family="Inter,system-ui,sans-serif" font-size="14" fill="#536174">Percent · illustrative data · source must be declared in production</text><g stroke="#D7DDE5" stroke-width="1"><path d="M80 120H740M80 190H740M80 260H740M80 330H740M80 400H740"/></g><g fill="#536174" font-family="Inter,system-ui,sans-serif" font-size="12"><text x="48" y="124">40%</text><text x="48" y="194">30%</text><text x="48" y="264">20%</text><text x="48" y="334">10%</text><text x="58" y="404">0%</text><text x="120" y="430">Q1</text><text x="280" y="430">Q2</text><text x="440" y="430">Q3</text><text x="600" y="430">Q4</text></g><path d="M130 190 290 225 450 280 610 315" fill="none" stroke="#276C68" stroke-width="4"/><g fill="#276C68"><circle cx="130" cy="190" r="6"/><circle cx="290" cy="225" r="6"/><circle cx="450" cy="280" r="6"/><circle cx="610" cy="315" r="6"/></g><text x="64" y="462" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#536174">Always provide source, period, units, filters, last updated, uncertainty where material, and a data-table alternative.</text></svg>