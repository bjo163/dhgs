<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">DHGS</title><desc id="desc">Default social preview for DHGS governance assurance platform.</desc><rect width="1200" height="630" fill="#F8F7F2"/><rect x="0" y="0" width="24" height="630" fill="#B8852F"/><g transform="translate(100 120) scale(2.3)"><path d="M12 32a20 20 0 0 0 40 0" fill="none" stroke="#132033" stroke-width="4" stroke-linecap="round"/><path d="M14 25a20 20 0 0 1 36-4" fill="none" stroke="#B8852F" stroke-width="4" stroke-linecap="round"/><path d="M15 32h34" stroke="#132033" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="32" r="4.5" fill="#276C68"/></g><text x="300" y="230" fill="#132033" font-family="Inter,system-ui,sans-serif" font-size="78" font-weight="750" letter-spacing="4">DHGS</text><text x="302" y="292" fill="#536174" font-family="Inter,system-ui,sans-serif" font-size="28">Divine–Human Governance System</text><text x="100" y="430" fill="#132033" font-family="Inter,system-ui,sans-serif" font-size="34" font-weight="650">Governance that can explain, review, correct and learn.</text><text x="100" y="490" fill="#536174" font-family="Inter,system-ui,sans-serif" font-size="22">Design must clarify power, not glorify it.</text></svg>