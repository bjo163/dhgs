<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Open Book</title><desc id="desc">A calm public transparency banner with the DHGS balance mark and layered document lines.</desc><rect width="1200" height="360" fill="#132033"/><circle cx="1040" cy="70" r="160" fill="#B8852F" opacity=".14"/><circle cx="1080" cy="250" r="210" fill="#276C68" opacity=".16"/><g transform="translate(90 80) scale(1.8)"><path d="M12 32a20 20 0 0 0 40 0" fill="none" stroke="#F8F7F2" stroke-width="4" stroke-linecap="round"/><path d="M14 25a20 20 0 0 1 36-4" fill="none" stroke="#B8852F" stroke-width="4" stroke-linecap="round"/><path d="M15 32h34" stroke="#F8F7F2" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="32" r="4.5" fill="#276C68"/></g><text x="230" y="150" fill="#F8F7F2" font-family="Inter,system-ui,sans-serif" font-size="54" font-weight="700">OPEN BOOK</text><text x="232" y="198" fill="#D7DDE5" font-family="Inter,system-ui,sans-serif" font-size="22">Public decisions that can be understood, reviewed and corrected.</text><g stroke="#F8F7F2" stroke-width="5" opacity=".55"><path d="M760 120h300M760 160h240M760 200h330M760 240h210"/></g></svg>